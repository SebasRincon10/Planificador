<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador Tareas</title>
        <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- CSS STYLE -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div></div>
    <div class="header-titulos">
        <h1 class="titulo-manuscrito">Planificador de Tareas</h1>
        <p class="subtitulo-semana">~ Proyecto Personal ~</p>
    </div>
    <div class="postit-rapido mx-auto">
        <span>📌 Mis Tareas</span>
    </div>
    </header>
    <div class="container d-flex flex-wrap justify-content-center">
    <div class="contenedor-principal col-12 col-lg-6">
    <section class="seccion-crear">
        <h2>✏️ Nueva Tarea</h2>
        <form id="formTarea" class="form-tarea">
            <input 
                type="text" 
                id="inputTarea" 
                placeholder="Escribe una tarea aquí..." 
                required 
                autocomplete="off"
            >
            <button type="submit" id="btnAgregar">Agregar</button>
        </form> 
    </section>
    </div>
    <div class="contenedor-principal col-12 col-lg-6">
    <section class="seccion-lista">
        <h2>📋 Mis Pendientes</h2>
        <ul id="listaTareas" class="lista-tareas">
            <li class="tarea-item">
                <label class="tarea-label">
                    <input type="checkbox">
                    <span class="texto-tarea">Revisar documentación del proyecto</span>
                </label>
            </li>
            <li class="tarea-item">
                <label class="tarea-label">
                    <input type="checkbox">
                    <span class="texto-tarea">Enviar reporte por correo</span>
                </label>
            </li>
        </ul>
    </section>
    </div>
    </div>










    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
