<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador Tareas</title>
        <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- CSS STYLE -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div></div>
    <div class="header-titulos">
        <h1 class="titulo-manuscrito">Planificador de Tareas</h1>
        <p class="subtitulo-semana">~ Proyecto Personal ~</p>
    </div>
    <div class="postit-rapido mx-auto">
        <span>📌 Mis Tareas</span>
    </div>
    </header>
    <div class="container d-flex flex-wrap justify-content-center">
    <div class="contenedor-principal col-12 col-lg-4">
    <section class="seccion-crear">
        <h2>✏️ Nueva Tarea</h2>
        <form id="formTarea" class="form-tarea d-flex flex-column">
            <input 
                type="text" 
                id="inputTarea" 
                placeholder="Escribe una tarea aquí..."  
                autocomplete="off"
            >
            <div class="invalid-feedback">Ingresa Tarea!</div>
            <input 
                type="date" 
                id="inputTareaFecha"     
                placeholder="Fecha de Entrega" 
                autocomplete="off"
            >
            <div class="invalid-feedback">Ingresa Fecha!</div>
            <select aria-label="Estado" 
                    id="inputTareaEstado" 
                    class="form-select">
                <option selected disabled value="">Seleccione Estado...</option>
                <option value="porHacer">Por Hacer</option>
                <option value="enProgreso">En Progreso</option>
            </select>
            <div class="invalid-feedback">Ingresa Estado!</div>
            <textarea id="inputTareaDescripcion" placeholder="Descripción de la tarea..." autocomplete="off"></textarea>
            <div class="invalid-feedback">Ingresa Descripción!</div>
            <button type="submit" id="btnAgregar">Agregar</button>
        </form> 
    </section>
    </div>
    <div class="contenedor-principal col-12 col-lg-8">
    <section class="seccion-lista">
        <h2>📋 Mis Pendientes</h2>
        <div class="contenedor-postits">
            <div class="postit">
                <div class="postit-header">
                    <span class="prioridad">Prioridad</span>
                    <button class="btn-eliminar">&times</button>
                </div>
                <h5 class="titulo">Diseñar Prototipo</h5>
                <p class="descripcion">Crear wireframes para la vista de tareas en Bootstrap.</p>
                <p></p>
                <small><i class="bi bi-calendar3"></i> 20 Marzo 2026</small>   
                <div class="postit-estado">
                    <small>Por Hacer</small>
                </div>
                <div class="postit-footer">
                    <button class="btn-completar" type="button" aria-pressed="true"><i class="bi bi-check2-circle"></i> Completar</button>
                </div>
            </div>
        </div>
    </section>
    </div>
    </div>









<!-- SWEETALERT2 -->
 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="./js/taskManager.js"></script>
<script src="./js/index.js"></script>
</body>
</html>
